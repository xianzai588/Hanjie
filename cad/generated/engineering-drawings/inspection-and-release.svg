<text x="70" y="625" class="section">三、工序检验与处置条件</text>
<text x="90" y="660" class="small">Ø40孔轴：位置度 Ø0.05，相对A、B；测量长度15 mm</text>
<text x="90" y="686" class="small">焊脚 z≥3.50；单段18；八段总长144 mm</text>
<text x="630" y="660" class="small">外缘 Ø149.94～149.98；壳体内径 Ø150.00～150.02</text>
