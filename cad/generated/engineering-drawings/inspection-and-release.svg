<text x="72" y="295" class="small">起弧前：工件温度15～35℃</text>
<text x="72" y="323" class="small">层间温度≤100℃；超温等待</text>
<text x="72" y="351" class="small">停弧后≥120 s且最高温度&lt;55℃才松夹</text>
<text x="72" y="379" class="small">冷却至20±1℃后进入独立测量</text>
<text x="70" y="445" class="section">二、基准与测量闭环</text>
