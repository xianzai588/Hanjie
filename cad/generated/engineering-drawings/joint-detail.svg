<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
<style>text{font-family:"Microsoft YaHei";font-size:17px;fill:#183247}.title{font-size:28px;font-weight:700}.small{font-size:14px}.section{font-size:21px;font-weight:700;fill:#176b7b}</style>
<rect x="0" y="0" width="1200" height="800" fill="#ffffff" stroke="#334155"/>
<rect x="25" y="25" width="1150" height="750" fill="#ffffff" stroke="#334155"/>
<text x="50" y="68" class="title">四道焊接截面与工艺设计卡</text>
<text x="50" y="99" class="small">角焊缝：6×18；单段逐道焊；相邻段不同时起弧；本卡为工艺提案，不是评定合格WPS</text>
<text x="1020" y="65" class="section">HJ-R1-002</text>
<rect x="435" y="185" width="50" height="360" fill="#cbd5e1" stroke="#334155"/>
<rect x="115" y="485" width="320" height="60" fill="#efd18b" stroke="#334155"/>
<polygon points="435.00,485.00 235.00,485.00 435.00,285.00" fill="#e2a18b" stroke="#334155"/>
<text x="145" y="580" class="note">QT450-10，t12</text>
<text x="410" y="165" class="note">Q235B，t5</text>
<text x="140" y="230" class="section">等效焊脚 z=3.50～3.80</text>
<line x1="140" y1="242" x2="325" y2="368" stroke="#176b7b" stroke-width="1.5"/>
<text x="95" y="630" class="note">图示为最终包络；四道面积不等于实际熔池形状</text>
<text x="95" y="663" class="small">每道沉积目标1.531～1.801 mm²；总面积6.125～7.206 mm²</text>
<text x="640" y="167" class="note">方法：自动TIG；直流正接（电极负极）</text>
<text x="640" y="205" class="note">焊材：NiFe 55类TIG实心棒，Ø1.6</text>
<text x="640" y="243" class="note">电流75 A；电压12 V；焊速1.5 mm/s</text>
<text x="640" y="281" class="note">固定送丝 1.344 mm/s；共4道</text>
<text x="640" y="319" class="note">沉积效率假设0.85～1.00，固定送丝计算</text>
<text x="640" y="357" class="note">纯氩99.999%；名义10 L/min</text>
<text x="640" y="395" class="note">预热名义150℃；起弧前各监测点≥130℃</text>
<text x="640" y="433" class="note">层间最高温度&lt;200℃；超温等待</text>
<text x="640" y="471" class="note">每道顺序 1→4→3→6→2→5</text>
<text x="640" y="509" class="note">每道净热输入330 J/mm；四道1320 J/mm</text>
<text x="640" y="547" class="note">本件净热输入142.56 kJ；弧燃时间288 s</text>
<text x="640" y="585" class="note">停弧后≥120 s且最高温度&lt;55℃才松夹</text>
<text x="640" y="623" class="note">冷却至20±1℃后独立测量并判定</text>
<line x1="50" y1="719" x2="1150" y2="719" stroke="#334155" stroke-width="1.5"/>
<text x="50" y="746" class="small">COMPETITION-R1 | 单位 mm | 设计图，未作制造签审 | 尺寸及能力要求不代表实测结果</text>
<text x="50" y="768" class="small">来源：project/competition-design.yaml；座体采用6P-FAIR_B真实BREP；工装柔性、热接触与生产设备未验证</text>
</svg>