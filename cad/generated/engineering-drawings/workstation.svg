<text x="368" y="498" class="small">安全PLC：防护门、夹紧、气幕、保护气、漏水、轨迹</text>
<text x="80" y="590" class="small">焊接站462.5 s；装配120；需微珩时CMM2×360 s（≥2站）＋微珩200 s（≥1站）</text>
<text x="80" y="625" class="small">固定定位窝数按 N≥ceil[(120＋工装释放时刻＋60)/462.5]；环境缓冲位另计</text>
<text x="80" y="660" class="small">PT单件33～68 min：≥9等待位；UT600 s/件：≥2工位；检测人员≥5当量</text>
<text x="80" y="691" class="small">逐件干态300 s：≥1位置；1800 s液体提取只用于牺牲样，独立实验室</text>
