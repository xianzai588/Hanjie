<text x="346" y="633" class="small">正向承托指：宽≤8、高≤1.8</text>
<text x="346" y="658" class="small">向上承压，单点≤100 N；六点同时锁止</text>
<text x="65" y="707" class="small">槽径向深3；槽高2.4；上缘距A面9.8；槽宽8.2；六槽60°等分</text>
<text x="620" y="152" class="small">45钢调质，屈服≥355 MPa；A面精磨</text>
<text x="620" y="187" class="small">独立托环z−20～0；孔150.20±0.04、外径180</text>
<text x="620" y="222" class="small">外侧6槽，60°等分；槽底R87，切向宽8.2</text>
<text x="620" y="257" class="small">槽z−12.2～−9.8，局部盲槽不切穿A面</text>
<text x="620" y="292" class="small">承托指宽≤8、高≤1.8，正向压住槽上面</text>
<text x="620" y="327" class="small">六点到位/锁止反馈齐全才上提；单点≤100 N</text>
<text x="620" y="362" class="small">六指接管后松定位窝锁止，壳体—环夹紧保留</text>
<text x="620" y="397" class="small">六点展开跨86.394；削弱有效宽11.88</text>
<text x="620" y="432" class="small">按整周槽削弱、厚20、E180 GPa、单跨100 N</text>
<text x="620" y="467" class="small">δ=PL³/(48EI)=0.942 μm</text>
<text x="620" y="502" class="small">托环平面/重复定位及永久变化按2 μm验收</text>
<text x="620" y="537" class="small">保留壳体两个平面定位约束及原A面夹紧</text>
<text x="620" y="572" class="small">托环随壳体上提140，固定锥和铜盘原位</text>
<text x="620" y="607" class="small">上提净隙见HJ-013；完全冷态才松开壳体</text>
<text x="620" y="642" class="small">微珩前后均独立CMM与内腔洁净复检</text>
