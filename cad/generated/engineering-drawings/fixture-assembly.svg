<text x="50" y="68" class="title">胀套定位、端面夹紧与主动回退</text>
<text x="50" y="99" class="small">内部锥只驱动圆柱胀套；轴向500 N通过独立压环—座体—底部三支点承受</text>
<text x="1020" y="65" class="section">HJ-R1-003</text>
<rect x="90" y="325" width="125" height="110" fill="#efd18b" stroke="#334155"/>
<rect x="415" y="325" width="125" height="110" fill="#efd18b" stroke="#334155"/>
<rect x="218" y="325" width="12" height="110" fill="#8cb6ae" stroke="#334155"/>
<rect x="400" y="325" width="12" height="110" fill="#8cb6ae" stroke="#334155"/>
<polygon points="230.00,422.00 400.00,422.00 370.00,295.00 260.00,295.00" fill="#b2c4cc" stroke="#334155"/>
<rect x="302" y="160" width="26" height="150" fill="#b2c4cc" stroke="#334155"/>
<rect x="155" y="295" width="320" height="30" fill="#8cb6ae" stroke="#334155"/>
<rect x="150" y="435" width="42" height="90" fill="#9baeb7" stroke="#334155"/>
<rect x="440" y="435" width="42" height="90" fill="#9baeb7" stroke="#334155"/>
