<text x="125" y="140" class="small">功能剖面：槽口及密封连接见技术要求</text>
<text x="80" y="220" class="note">独立压环：500 N</text>
<text x="350" y="220" class="note">内置拉杆／顶回肩</text>
<text x="100" y="593" class="small">三支点位于R30，等间隔120°</text>
<text x="100" y="627" class="small">支点端面极差≤0.003（制造要求）</text>
<text x="100" y="661" class="small">承力柱Ø20；下托盘Ø72×4；支点Ø8</text>
<text x="640" y="167" class="note">孔内接触件为开缝圆柱胀套，避免孔缘楔入</text>
<text x="640" y="205" class="note">收拢外径39.94；最大撑开外径40.04</text>
<text x="640" y="243" class="note">两接触带：z101～103、109～111</text>
<text x="640" y="281" class="note">锥半角10°；锥不与工件孔直接接触</text>
<text x="640" y="319" class="note">正向顶回肩＋拉杆；回退行程1.00</text>
<text x="640" y="357" class="note">覆盖全径差所需理想行程 0.284</text>
<text x="640" y="395" class="note">μ=0.20仍可能自锁，禁止仅靠弹簧回位</text>
<text x="640" y="433" class="note">径向合力标量上限100 N（机构设计要求）</text>
<text x="640" y="471" class="note">摩擦未知时驱动力上限17.63 N，再限行程</text>
<text x="640" y="509" class="note">0.221 MPa仅名义平均带压，不是峰值</text>
<text x="640" y="547" class="note">上部压环／执行器包络R30，z112～220</text>
<text x="640" y="585" class="note">温度满足→压环卸载→顶回→确认收拢</text>
<text x="640" y="623" class="note">下部支承与接料盘同一组件向下退出</text>
<line x1="50" y1="719" x2="1150" y2="719" stroke="#334155" stroke-width="1.5"/>
<text x="50" y="746" class="small">COMPETITION-R1 | 单位 mm | 设计图，未作制造签审 | 尺寸及能力要求不代表实测结果</text>
<text x="50" y="768" class="small">来源：project/competition-design.yaml；座体采用6P-FAIR_B真实BREP；工装柔性、热接触与生产设备未验证</text>
