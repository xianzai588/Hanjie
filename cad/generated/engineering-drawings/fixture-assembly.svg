<text x="125" y="140" class="small">功能剖面：槽口及密封连接见技术要求</text>
<text x="80" y="220" class="note">独立压环：500 N</text>
<text x="350" y="220" class="note">上部M12驱动／正向止挡</text>
<text x="100" y="593" class="small">三支点位于R30，等间隔120°</text>
<text x="100" y="627" class="small">托垫只受压允许脱离；制造端面极差≤0.0025；含热差≤0.003</text>
<text x="100" y="661" class="small">固定承力柱Ø144×100；托盘Ø72×14；托垫Ø8×6</text>
<text x="640" y="167" class="small">六指胀套套在固定反向锥上；上退释放</text>
<text x="640" y="205" class="small">收拢外径39.94；最大撑开外径40.04</text>
<text x="640" y="243" class="small">连续接触带：z100.2～114.8</text>
<text x="640" y="281" class="small">锥10°：下端大、上端小；芯固定、套上退</text>
<text x="640" y="319" class="small">正向顶回肩＋拉杆；回退行程1.00</text>
<text x="640" y="357" class="small">覆盖全径差所需理想行程 0.284</text>
<text x="640" y="395" class="small">μ=0.20仍可能自锁，禁止仅靠弹簧回位</text>
<text x="640" y="433" class="small">径向预载≤100 N；热反力由机械止挡承受</text>
<text x="640" y="471" class="small">胀套6指：L30、t0.8、宽19；外圆同轴≤0.003</text>
<text x="640" y="509" class="small">整体实心固定锥；胀套止挡设计承载5000 N</text>
<text x="640" y="547" class="small">上承力筒Ø70/Ø24，z155.4～400；门架见HJ-013</text>
<text x="640" y="585" class="small">M36-8.8，90±9 kN/只；基座啮合≥55、盲深≥70；</text>
<text x="640" y="601" class="small">柱不升降</text>
<text x="640" y="623" class="small">45钢屈服≥355；法兰Ø440×140；12-M36×200/</text>
<text x="640" y="639" class="small">PCD360；详HJ-012</text>
