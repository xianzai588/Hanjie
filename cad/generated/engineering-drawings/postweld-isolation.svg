<line x1="306" y1="439" x2="505" y2="439" stroke="#176b7b" stroke-width="3"/>
<text x="80" y="184" class="small">外缘翼片仅18：不设跨槽的虚构封口台面</text>
<text x="80" y="407" class="small">整盘OD149.40±0.05；壁1/底2；盘面z96、唇z99</text>
<text x="80" y="466" class="small">缩态密封OD≤149.6；20～30 kPa充气后贴合钢壁</text>
<text x="80" y="490" class="small">无径向滑擦；膜应力界0.16 MPa，采购强度≥2 MPa</text>
<text x="80" y="514" class="small">加厚圈扣占位后容量47.73 mL；Ø4密闭回液</text>
<text x="635" y="148" class="section">B：微珩上下罩（轴向剖面NTS）</text>
<rect x="650" y="290" width="185" height="70" fill="#dbe6eb" stroke="#334155"/>
<rect x="925" y="290" width="185" height="70" fill="#dbe6eb" stroke="#334155"/>
<rect x="715" y="210" width="330" height="60" fill="#eaf4f5" stroke="#334155"/>
<rect x="828" y="205" width="104" height="80" fill="#ffffff" stroke="#334155"/>
<rect x="862" y="160" width="36" height="188" fill="#a9bdc9" stroke="#334155"/>
<polygon points="730.00,370.00 730.00,435.00 1030.00,435.00 1030.00,370.00 1005.00,370.00 1005.00,410.00 755.00,410.00 755.00,370.00" fill="#eaf4f5" stroke="#334155"/>
<rect x="735" y="360" width="22" height="10" fill="#ddba7d" stroke="#334155"/>
<rect x="1003" y="360" width="22" height="10" fill="#ddba7d" stroke="#334155"/>
<line x1="880" y1="435" x2="880" y2="483" stroke="#176b7b" stroke-width="6"/>
<line x1="880" y1="483" x2="1060" y2="483" stroke="#176b7b" stroke-width="3"/>
<text x="655" y="515" class="small">下杯OD60/ID44/液深10；密封R27，压紧≤120 N</text>
<text x="655" y="541" class="small">面圈Ø1.00±0.02；槽0.70±0.01/挡隙0.10±0.01</text>
<text x="655" y="567" class="small">杯内占位扣3 mL后容量12.21；故障需7.10 mL</text>
<text x="655" y="593" class="small">供液≤60 mL/min；Ø4下引排液；吸压−2～−5 kPa</text>
<text x="655" y="619" class="small">失吸0.10 s停进给/供液；管内可回流量≤5 mL</text>
<text x="70" y="558" class="small">整盘从壳底竖直装入：缩态→z96就位→充气→吸压/密封联锁</text>
<text x="70" y="586" class="small">抽尽并原位干燥→壳底接密闭收集筒→保持盘朝上/抽吸→泄压下撤</text>
<text x="70" y="614" class="small">PT/UT整盘与微珩下杯分工序装入，均从壳底撤出；禁止座下叠放</text>
<text x="70" y="650" class="small">荧光液及5/10/25 μm颗粒覆盖正常、失吸、停机和撤出；牺牲件下腔未清洗检查</text>
<text x="70" y="680" class="small">正常产品：过程记录＋干态内窥＋封存；过滤膜提取只用于退出产品流的牺牲件</text>
