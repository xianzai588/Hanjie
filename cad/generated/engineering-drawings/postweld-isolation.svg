<text x="50" y="68" class="title">PT/UT独立接液盘与短孔微珩全收集装置</text>
<text x="50" y="99" class="small">冷态后序工具；进入NDT/微珩前先闭合隔离，液体/磨屑与不可清洗下腔隔开</text>
<text x="1020" y="65" class="section">HJ-015</text>
<text x="60" y="148" class="section">A：PT/UT座下整盘（径向剖面NTS）</text>
