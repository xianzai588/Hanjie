<rect x="325" y="264" width="165" height="60" fill="#dbe6eb" stroke="#334155"/>
<polygon points="110.00,338.00 110.00,380.00 502.00,380.00 502.00,338.00 484.00,338.00 484.00,360.00 128.00,360.00 128.00,338.00" fill="#eaf4f5" stroke="#334155"/>
<rect x="102" y="334" width="16" height="25" fill="#ddba7d" stroke="#334155"/>
<rect x="502" y="334" width="16" height="25" fill="#ddba7d" stroke="#334155"/>
