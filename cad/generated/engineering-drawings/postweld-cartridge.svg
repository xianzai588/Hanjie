<text x="50" y="99" class="small">冷态独立NDT工位；壳体先脱离固定焊接芯轴；关键配合按本图单独公差</text>
<text x="1020" y="65" class="section">HJ-016</text>
<text x="65" y="145" class="section">A：外缘密封槽放大剖面（NTS）</text>
<rect x="370" y="202" width="22" height="280" fill="#a9bdc9" stroke="#334155"/>
<polygon points="110.00,250.00 270.00,250.00 270.00,330.00 242.00,330.00 242.00,392.00 270.00,392.00 270.00,470.00 110.00,470.00" fill="#eaf4f5" stroke="#334155"/>
<rect x="242" y="332" width="118" height="58" fill="#ddba7d" stroke="#334155"/>
<line x1="170" y1="360" x2="242" y2="360" stroke="#176b7b" stroke-width="4"/>
<line x1="170" y1="360" x2="170" y2="495" stroke="#176b7b" stroke-width="4"/>
<text x="75" y="187" class="small">环裙z88～97，壁2；上缘至z99，盘面z96</text>
<text x="72" y="523" class="small">槽中心z93；宽6.20±0.05/径向深0.75±0.02</text>
<text x="72" y="549" class="small">槽底剩余壁≥1.18；缩态径向高度≤0.80</text>
<text x="72" y="575" class="small">模压双底脚扣入连续燕尾唇；下方分瓣压圈锁持</text>
<text x="72" y="601" class="small">Ø1充气口＋焊接Ø2管；独立于Ø4回液路</text>
<text x="72" y="627" class="small">充态径向伸出1.25；20～30 kPa，贴壁后禁止滑移</text>
<text x="610" y="145" class="section">B：独立支架与收集筒（NTS）</text>
<rect x="644" y="195" width="20" height="120" fill="#a9bdc9" stroke="#334155"/>
<rect x="1074" y="195" width="20" height="120" fill="#a9bdc9" stroke="#334155"/>
