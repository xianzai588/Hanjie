<rect x="829" y="478" width="80" height="26" fill="#a9bdc9" stroke="#334155"/>
<text x="615" y="535" class="small">托环OD180/ID150.20；筒法兰OD174接托环底面</text>
<text x="615" y="561" class="small">筒ID152.00±0.05；顶口z−20/底z−170</text>
<text x="615" y="587" class="small">端面圈R83/线径2；槽深1.50，金属挡隙0.10</text>
<text x="615" y="613" class="small">中央Ø12×258支杆；双导向距50；升降额定200 N</text>
<text x="615" y="639" class="small">焊接金属波纹管贯穿密闭筒底；额定行程130</text>
<text x="70" y="665" class="small">装入偏心≤0.10、倾角≤0.05°：最小入壳间隙0.095；先对中再上升，不靠刮壁导向</text>
<text x="70" y="688" class="small">撤出行程125±0.10：最高唇口z≤−25.8；筒内径向余量≥1.08；保抽吸、排尽/干燥后泄压下撤</text>
<text x="70" y="711" class="small">筒内全收纳后封口脱开；回液瓶独立、所有充气/回液接头在盘底；正常产品下腔不作整腔清洗</text>
