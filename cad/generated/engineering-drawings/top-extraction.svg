<text x="50" y="68" class="title">顶部抽吸、过滤接口与转运退位</text>
<text x="50" y="99" class="small">当前工位不安装随动轻击；抽吸头工作位固定，转运前正向径退，四口反馈齐全才允许壳体上提</text>
<text x="1020" y="65" class="section">HJ-009</text>
<text x="65" y="150" class="section">俯视工作/退位包络（单位mm，NTS）</text>
