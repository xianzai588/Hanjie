<text x="474.15897167125934" y="542.1589716712595" class="small">E4</text>
<text x="65" y="679" class="small">实色：R78工作位；空圈：R93退位；4头Ø外≤10；壳外R80</text>
<text x="72" y="712" class="small">头中心z210、喉Ø4；口下缘≥z205；不伸入z115焊缝近区</text>
<text x="620" y="153" class="small">4个口45°起，每90°；朝下并向内15°。</text>
<text x="620" y="182" class="small">各5.5～7，总22～28 L/min。</text>
<text x="620" y="211" class="small">喉Ø4→ID6支管→ID12总管；支管软段≥100。</text>
<text x="620" y="240" class="small">316L头，外径≤10；4个径向导轨行程15。</text>
<text x="620" y="269" class="small">导轨装在R105上口外框，安装端z220。</text>
<text x="620" y="298" class="small">各座30×20、2-M5/孔距20；调位误差≤0.5。</text>
<text x="620" y="327" class="small">工作中心R78±0.5；退位R93±0.5。</text>
<text x="620" y="356" class="small">退位最内包络≥87.5，避开R80钢壳。</text>
<text x="620" y="385" class="small">软管固定防擦，最小弯曲R≥15；不自由拖曳。</text>
<text x="620" y="414" class="small">两端正向销；中途弹簧抱杆锁保持当前位置。</text>
<text x="620" y="443" class="small">各口双位置反馈；缺退位信号禁止壳体上提。</text>
<text x="620" y="472" class="small">干式金属捕集杯→预滤→H13→流量/压差→抽气。</text>
<text x="620" y="501" class="small">滤器在工位外；过滤排气禁止接回氩保护。</text>
<text x="620" y="530" class="small">前吹30 s，流量稳定≥5 s才起弧。</text>
<text x="620" y="559" class="small">末弧保持≥120 s且热区&lt;55℃、清盘合格。</text>
<text x="620" y="588" class="small">关补氩→四口径退15确认→壳体上提140。</text>
<text x="620" y="617" class="small">工作位抽烟；退态不计捕烟，清盘独立回收。</text>
<text x="620" y="646" class="small">气水分路及故障保持逻辑见HJ-023/HJ-C-03。</text>
