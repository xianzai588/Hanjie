<text x="70" y="667" class="small">上下承力路径独立；上驱动径向浮动，500 N压环球铰传力</text>
<text x="70" y="690" class="small">门架腿示意投影；实际四柱位于(±180,±180)，与底座同平面</text>
<text x="590" y="152" class="small">45钢整体实心反锥：下大、上小，半角10°</text>
<text x="590" y="187" class="small">有效接触z100.2～114.8；两端各延伸0.4</text>
<text x="590" y="222" class="small">上承力筒Ø70/Ø24，L244.6，z155.4～400</text>
<text x="590" y="257" class="small">止挡头Ø100×20，z380～400；门架孔Ø110</text>
<text x="590" y="292" class="small">门架板460×460×100，z400～500；四柱Ø80</text>
<text x="590" y="327" class="small">四柱z−160～400；按360净跨、120有效条带核算</text>
<text x="590" y="362" class="small">两止挡26×30×20，z400～420；径退20后放行</text>
<text x="590" y="397" class="small">止挡口袋x42～90及−90～−42；接触宽≥7</text>
<text x="590" y="432" class="small">M12只作设置/回退；热反力经止挡、筒和门架</text>
<text x="590" y="467" class="small">胀套先上退1，再上提260；固定锥保持原位</text>
<text x="590" y="502" class="small">A托环OD180/ID150.20±0.04/厚20保持壳底夹紧</text>
<text x="590" y="537" class="small">外侧6槽/60°与六点正向转运见HJ-014</text>
<text x="590" y="572" class="small">壳体连托环上提140：托环底至固定锥顶净隙4.8</text>
<text x="590" y="607" class="small">胀套底至抬起壳口净隙19.8；铜顶至壳底40.5</text>
<text x="590" y="642" class="small">完全冷态才松开A托环，独立CMM复测孔轴</text>
<text x="590" y="677" class="small">铜盘及水路不随转运升降；机器人移动至固定窝</text>
