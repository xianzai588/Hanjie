<text x="50.0" y="90.0" class="subtitle" text-anchor="start">PROCESS ASSEMBLY / ACCESS + SHIELD + CONTROLLED WITHDRAWAL</text>
<text x="1140.0" y="65.0" class="section" text-anchor="end">HJ-DRW-008</text>
<text x="80.0" y="145.0" class="section" text-anchor="start">SECTION THROUGH WELD STATION</text>
