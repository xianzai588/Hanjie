<text x="65" y="155" class="small">同轴工序剖面，翼片方向简化投影</text>
<text x="65" y="698" class="small">盘面朝上；密封回缩0.5后竖直下撤；禁止刮壁</text>
<text x="640" y="167" class="small">刚性盘Ø148；底板1；底面z90</text>
<text x="640" y="205" class="small">C11000铜环OD149.60 / ID143.60 / z9</text>
<text x="640" y="221" class="small">4～99</text>
<text x="640" y="243" class="small">静态密封0.30厚；先回缩再下撤，避免自生屑</text>
<text x="640" y="281" class="small">水路Ø2，0.20 L/min；气水分离，检漏互锁</text>
<text x="640" y="319" class="small">气道3×2；12孔Ø1.0向上；10～15 L/min</text>
<text x="640" y="357" class="small">静态密封＋盘面截留；气幕辅助，不承诺悬浮全部颗粒</text>
<text x="640" y="395" class="small">下撤不经过Ø40孔，不依赖收折倒渣</text>
<text x="640" y="433" class="small">焊枪30°弯头＋竖直枪体；喷嘴Ø10</text>
<text x="640" y="471" class="small">送丝管与焊枪周向错开，出口偏置y=-4</text>
<text x="640" y="509" class="small">所建模焊枪／送丝最小间距 2.28</text>
<text x="640" y="547" class="small">执行互锁：防护在位、底口开放、轨迹确认</text>
<text x="640" y="585" class="small">冷却松夹→胀套顶回确认→组件下撤→封盖</text>
<text x="640" y="623" class="small">内窥镜＋全表面颗粒检查，不以低飞溅免责</text>
