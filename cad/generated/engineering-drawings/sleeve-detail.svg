<text x="620" y="170" class="note">胀套：17-4PH 或同等强度耐蚀钢；有效壁厚2.0</text>
<text x="620" y="206" class="note">槽数6；槽宽0.80；槽底R1.00；槽深贯穿至内孔但不延伸出接触带</text>
<text x="620" y="242" class="note">接触带 z101～103、109～111；覆盖率90%</text>
<text x="620" y="278" class="note">锥芯半角10°；有效驱动长度8；锥面Ra1.6</text>
<text x="620" y="314" class="note">拉杆接口 M12×1.5；压环端面承担500 N轴向力</text>
<text x="620" y="350" class="note">回退肩＋机械止挡：正向行程1.00，收拢确认后才允许下撤</text>
<text x="620" y="386" class="note">防转：拉杆端键宽4×4，胀套外圆导向键槽；不靠摩擦传扭</text>
<text x="620" y="422" class="note">径向合力标量≤100 N；驱动力上限由可更换限力垫片设定</text>
<text x="620" y="458" class="note">配合：锥芯/拉杆 H7/g6；胀套外圆与孔为功能接触，不作过盈配合</text>
<text x="620" y="494" class="note">关键表面：接触带Ra0.8，槽口去毛刺R0.2，边缘不得划伤孔壁</text>
<text x="620" y="530" class="note">详图用于工程评审；材料批次、热处理和弹性回程仍需验证</text>
