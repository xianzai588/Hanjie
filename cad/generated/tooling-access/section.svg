<text x="170" y="795" class="small">底口退出（需开放底口及下方操作空间）</text>
<text x="70" y="225" class="small">壳体 Ø160 × 200 × 5</text>
<text x="135" y="450" class="small">座体 Ø40 孔</text>
<text x="135" y="555" class="small">截留盘 Ø148</text>
<text x="340" y="555" class="small">壁隙 1 mm</text>
<text x="590" y="160" class="title">检查范围与关键结论</text>
<text x="590" y="207" class="">蓝色盘：底板1 mm、总高3 mm，位于座体下方6 mm。</text>
<text x="590" y="246" class="">整盘向下退出：扫掠圆柱与壳体/三种座体均不相交。</text>
<text x="590" y="285" class="">整盘向上退出：与已焊座体相交，不能穿过Ø40孔。</text>
<text x="590" y="324" class="">30°弯头后竖直枪体：保留为几何可达性候选。</text>
<text x="590" y="363" class="">直线延长枪体与中心定位包络可能冲突，需比较。</text>
<text x="590" y="402" class="">绿色仅为上方定位机构占位包络，不是完整夹具。</text>
<text x="590" y="441" class="">1:50锥度与圆柱孔是边缘接触，不是全孔贴合。</text>
<text x="590" y="480" class="">锥面存在自锁情景；定位重复性及主动退锥待设计。</text>
<text x="590" y="519" class="">截留盘外缘未覆盖R74.98接口的垂直落物路径。</text>
<text x="590" y="558" class="">仍需可收拢挡边/源头封挡；不得宣称内腔洁净达标。</text>
<text x="590" y="597" class="">未包含：支承、腕部、送丝机构、管线与热变形。</text>
<text x="45" y="825" class="small">来源：既有CAD实体＋TOOLING-ACCESS/config.yaml工装假设；比例用于剖面表达，非加工图。</text>
</svg>