[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hanjie"
version = "4.1.0"
description = "面向 Ø0.05 mm 位置度的 QT450-10/Q235B 异种焊接热—结构鲁棒协同优化与自适应质量控制系统"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "PyYAML>=6.0",
    "jsonschema>=4.20",
    "opencv-python>=4.8",
    "scikit-fem>=11.0",
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v"
