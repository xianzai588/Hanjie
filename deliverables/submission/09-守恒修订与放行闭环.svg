<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
<style>text{font-family:'Microsoft YaHei',sans-serif;fill:#183247}.title{font-size:30px;font-weight:700}.h{font-size:23px;font-weight:700}.b{font-size:18px}</style>
<rect width="1200" height="700" fill="#f8fafc"/>
<text x="55" y="65" class="title">8P两道脉冲TIG：工艺设计与验证闭环</text>
<rect x="55" y="110" width="1090" height="135" rx="10" fill="#e7f1f5" stroke="#176b7b"/>
<text x="80" y="150" class="h">工艺与守恒</text>
<text x="80" y="190" class="b">8×18 mm、两道；Ø1.60±0.01；送丝3.50±0.05 mm/s；焊速1.65±2%</text>
<text x="80" y="220" class="b">面积7.326～8.760 mm²；等效焊脚3.828～4.186；名义净热86.40 kJ；弧燃174.5 s</text>
<rect x="55" y="275" width="1090" height="160" rx="10" fill="#fff1c7" stroke="#b7791f"/>
<text x="80" y="315" class="h">焊接本身控形</text>
<text x="80" y="355" class="b">柔顺槽＋对称焊序＋胀套／压环＋低热量；冷却卸夹后使用独立A/B基准拟合孔轴</text>
<text x="80" y="388" class="b">空间与时间复核分别要求≤5%；预算=2×0.0140＋已验证热残余＋0.002≤0.05 mm</text>
<text x="80" y="418" class="b">任何微珩前测位置度；仅39.995～40.000欠尺寸孔恢复，直径增量≤0.005 mm</text>
<rect x="55" y="465" width="1090" height="160" rx="10" fill="#dbeafe" stroke="#2563eb"/>
<text x="80" y="505" class="h">界面与洁净检验</text>
<text x="80" y="545" class="b">Ni99两层逐层配混；加工后表面第二层≥0.50 mm；最终熔深≤0.40 mm</text>
<text x="80" y="578" class="b">宏观截面／HV／裂纹检查；铜环≤45℃、挡唇静密封、气幕＋补氩＋腔压闭环</text>
<text x="80" y="608" class="b">后续试制：界面金相、CMM、见证片与颗粒检验、载荷与疲劳资格目标确认（说明书§7）</text>
</svg>