<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
<style>text{font-family:'Microsoft YaHei',sans-serif;fill:#183247}.title{font-size:30px;font-weight:700}.h{font-size:23px;font-weight:700}.b{font-size:18px}</style>
<rect width="1200" height="700" fill="#f8fafc"/>
<text x="55" y="65" class="title">设计依据与工程确认分工（修订4）</text>
<rect x="55" y="110" width="1090" height="135" rx="10" fill="#e7f1f5" stroke="#176b7b"/>
<text x="80" y="150" class="h">官方输入与公开依据</text>
<text x="80" y="190" class="b">尺寸、材料、Ø0.05位置度及无落腔飞溅；五个评价维度；报告／设计图路线</text>
<text x="80" y="220" class="b">真实标准与文献、供方棒材成分；Schaeffler原图域与高镍适用边界</text>
<rect x="55" y="275" width="1090" height="150" rx="10" fill="#fff1c7" stroke="#b7791f"/>
<text x="80" y="315" class="h">设计输入与实际计算</text>
<text x="80" y="355" class="b">工艺窗口、物性插值、热源形状、装夹及公差分配；静载与资格目标疲劳曲线</text>
<text x="80" y="388" class="b">熔敷守恒、逐层配混、热胀与气量核算；整件冷却卸夹与独立空间／时间精度复核</text>
<rect x="55" y="455" width="1090" height="160" rx="10" fill="#dbeafe" stroke="#2563eb"/>
<text x="80" y="495" class="h">后续A类实物工程确认（说明书§7）</text>
<text x="80" y="535" class="b">Ni99首次界面与最终接头截面、PMZ／HAZ硬度与裂纹；热源宽度／效率校准</text>
<text x="80" y="568" class="b">CMM位置度与重复定心；热态密封／颗粒见证片；温控／轻击记录；多级疲劳试验</text>
<text x="80" y="598" class="b">计算记录不称为实测性能，微珩不纠正孔轴，连续焊对比不继承8P热变形结果</text>
</svg>