<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
<rect width="1200" height="720" fill="#f8fafc"/><text x="60" y="70" font-family="Arial" font-size="32" font-weight="700" fill="#17324d">COMPETITION-R1 证据等级总图</text>
<text x="60" y="108" font-family="Arial" font-size="17" fill="#475569">绿色：当前数字设计可成立　黄色：设计目标/分配　灰色：未执行的物理放行</text>
<rect x="60" y="145" width="1080" height="145" rx="16" fill="#d9f2e6" stroke="#2a9d8f" stroke-width="3"/><text x="90" y="190" font-family="Arial" font-size="24" font-weight="700" fill="#176b5c">当前可成立（数字证据）</text><text x="90" y="232" font-family="Arial" font-size="19" fill="#17324d">真实 CAD 实体与无干涉包络　·　沉积守恒与净热输入　·　条件承载筛查</text><text x="90" y="265" font-family="Arial" font-size="19" fill="#17324d">底口下撤路径　·　软件互锁逻辑　·　6P/8P 确定性切换边界</text>
<rect x="60" y="320" width="1080" height="145" rx="16" fill="#fff1c7" stroke="#e9c46a" stroke-width="3"/><text x="90" y="365" font-family="Arial" font-size="24" font-weight="700" fill="#8a6412">设计目标（需制造/测量闭环）</text><text x="90" y="407" font-family="Arial" font-size="19" fill="#17324d">热残余 ≤0.008 mm　·　胀套重复性 0.003 mm　·　测量扩展不确定度 0.002 mm</text><text x="90" y="440" font-family="Arial" font-size="19" fill="#17324d">连续薄裙热态贴壁与 0.35 mm 径向顺应　·　四道焊缝成形</text>
<rect x="60" y="495" width="1080" height="145" rx="16" fill="#e5e7eb" stroke="#64748b" stroke-width="3"/><text x="90" y="540" font-family="Arial" font-size="24" font-weight="700" fill="#475569">尚未执行（不得越级宣称）</text><text x="90" y="582" font-family="Arial" font-size="19" fill="#17324d">CMM 实物位置度　·　金相/宏观截面　·　NDT 与裂纹检查　·　颗粒清点/内窥</text><text x="90" y="615" font-family="Arial" font-size="19" fill="#17324d">WPS/PQR 与疲劳评定　·　热—结构完整四道验证　·　制造签审</text>
