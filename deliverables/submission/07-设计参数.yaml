version: COMPETITION-R3
scope: 参赛设计方案；历史仿真输入保持原版本，本配置不追认旧结果
layout: 8P-FAIR_B
geometry_manifest: simulation/structural-v4/models/8p-fair-b/geometry-manifest.json
seat_brep: simulation/structural-v4/models/8p-fair-b/8P-FAIR_B.brep
shell_brep: simulation/structural-v4/common/shell.brep
process_source: project/process-r3.yaml
assembly:
  seat_bottom_z_mm: 100.0
  bottom_open: true
  bottom_clearance_mm: 120.0
  datum_A: 壳体下端独立安装面
  datum_B: 壳体内壁两个轴向测量带拟合的轴线，按A法向约束定向
process:
  pass_count: 2
  sequence:
  - 1
  - 5
  - 3
  - 7
  - 2
  - 6
  - 4
  - 8
  wire_diameter_mm: 1.6
  deposition_efficiency_range:
  - 0.9
  - 0.98
  minimum_leg_mm: 3.5
  clearance_leg_mm: 4.3
  feed_policy: 送丝3.50±0.05 mm/s，实际分辨率≤0.01；速度与丝径公差均入守恒边界
  filler_candidate: Ni99预制隔离层＋NiFe55两道承载焊；隔离层制作在轴承孔最终精加工之前
  filler_source: https://certilas.com/en/product/nife-55-tig
  wire_entry_offset_xyz_mm:
  - -1.0
  - -4.0
  - -0.5
  hold_after_arc_s: 120.0
  release_below_c: 55.0
  measurement_temperature_c: 20.0
  measurement_temperature_band_c: 1.0
  feed_nominal_mm_s: 3.5
  feed_tolerance_mm_s: 0.05
  wire_diameter_tolerance_mm: 0.01
  travel_relative_tolerance: 0.02
thermal_regime:
  method: 铸铁冷焊（不预热）
  design_basis: 选择不预热短段冷焊，局部温度与卸夹位移由当前整件计算评价；预制Ni99层抑制QT侧直接稀释
  start_temperature_c: 20.0
  start_temperature_min_c: 15.0
  preheat_policy: 组焊不预热；Ni99预制堆焊是独立前工序，之后完成精加工及来料检验
  interpass_limit_c: 100.0
  interpass_measurement: 距焊道边缘10 mm的座体表面，接触式热电偶或红外测温
  seat_stored_heat_kj:
    at_20c: 0.0
    at_100c: 25.19
    at_150c: 40.94
    at_500c: 151.15
  free_radial_contraction_mm:
    at_interpass_100c: 0.063
    at_preheat_150c: 0.1024
    at_interpass_200c: 0.1418
    at_hot_weld_500c: 0.378
  component_heat_capacity_j_per_k: 2092.0
  shielding: 停弧后维持装夹；按温度门控退出；铜环冷却保持低流量，避免强制骤冷
peening:
  method: 焊后半热态气动圆头锤轻击
  mechanism: 热态轻击使焊缝局部塑性延展，减轻收缩拉应力；强度与位置度计算不计锤击增益
  window_c:
  - 400.0
  - 500.0
  lower_prohibited_below_c: 400
  tool: 气动圆头锤，Ø8 mm球头（范围Ø6～10 mm）
  air_pressure_mpa:
  - 0.2
  - 0.4
  impact_rate_per_min:
  - 2000
  - 3000
  overlap_fraction_min: 0.75
  coverage: 仅熔敷焊道中部；与QT母材、熔合线、焊趾各留≥0.5 mm，禁止直接敲击脆硬HAZ
  acceptance: 无撕裂、剥离；压痕深度≤0.05 mm；首件确定最低有效气压，不追求深麻点
  sequence: 两道×八段；实测400～500℃才轻击，超出窗口则跳过并记录，不为锤击二次加热
fixture:
  type: 内置锥驱动开缝圆柱胀套＋独立端面压环＋底部承力柱
  bore_limits_mm:
  - 40.0
  - 40.025
  collapsed_sleeve_diameter_mm: 39.94
  maximum_sleeve_diameter_mm: 40.04
  contact_bands_z_mm:
  - - 100.2
    - 111.8
  contact_coverage_fraction: 0.9
  internal_cone_half_angle_deg: 10.0
  positive_return_stroke_mm: 1.0
  radial_force_limit_n: 100
  friction_scenarios:
  - 0.0
  - 0.05
  - 0.1
  - 0.2
  axial_clamp_force_n: 500.0
  upper_envelope_radius_mm: 30.0
  upper_envelope_top_z_mm: 220.0
  support_radius_mm: 30.0
  support_pad_radius_mm: 4.0
  support_count: 3
  support_top_z_mm: 100.0
  carrier_disk_radius_mm: 36.0
  carrier_disk_z_mm:
  - 86.0
  - 90.0
  carrier_post_radius_mm: 10.0
  carrier_post_bottom_z_mm: -20.0
  radial_force_limit_scope: 装夹预载≤100 N；热收缩反力另按胀套/芯轴结构强度校核
  finger_thickness_mm: 0.8
  finger_length_mm: 30
  finger_count: 6
  finger_width_mm: 19
  mechanical_backstop: 芯轴到位后机械止挡承受热收缩反力；气缸用于预载及正向回退
shield:
  type: 分体式耐热导热紫铜衬环＋底部微正压氩气幕＋顶部负压排烟
  design_basis: 刚性接料盘及静态密封阻断落屑路径，气幕辅助吹扫；不以气流阻止所有颗粒
  rigid_radius_mm: 74.0
  floor_z_mm: 90.0
  floor_thickness_mm: 1.0
  ring_bottom_z_mm: 94
  ring_top_z_mm: 99
  ring_inner_radius_mm: 71.8
  ring_outer_radius_mm: 74.8
  ring_material: C11000；水冷通道Ø2.0，0.20 L/min，入口20±5℃；接触导热取设计范围500～2000 W/(m²K)
  ring_wall_thickness_mm: 3
  ring_split_count: 2
  ring_contact_mode: 铜环OD149.60；环缘可更换0.30 mm厚耐热石英纤维密封；分体径向回缩0.5 mm后下撤
  gas_curtain:
    gas: 99.999% Ar
    flow_range_l_min:
    - 10.0
    - 15.0
    pressure_mode: 罩外补气，腔内压差保持0～+20 Pa；不抽空保护区
    inlet: 盘下环形气道3×2，12孔Ø1.0朝上；接头M5，独立于水路
    outlet: 顶部封闭罩，抽气22～28 L/min；护气8～12＋气幕10～15合计18～27
    flow_interlock: 氩气流量未落入10～15 L/min窗口时安全联锁禁止起弧
  material_candidate: 分体式紫铜卡环＋刚性不锈钢接料盘；铜环与底盘螺栓连接，可拆换清洁
  joint_design: 铜衬环通过外径机械限位于盘体凹槽，盘体与穿盘支承螺栓密封；物理可靠，无易损薄壁件
  withdrawal: 焊后冷却至55°C以下，保持工装朝上姿态从壳体底部开口竖直退出，随后封盖隔离
  seal_radial_thickness_mm: 0.3
precision:
  limit_diameter_mm: 0.05
  bore_length_mm: 12.0
  support_height_spread_limit_mm: 0.003
  radial_allocations_mm:
    datum_transfer: 0.003
    fixture_axis_setting: 0.003
    sleeve_centering: 0.003
    clamp_elastic_shift: 0.002
    thermal_residual_target: 0.008
    release_shift_target: 0.002
  status: 设计分配；位置度预算在热残余等分配值满足条件时闭合，实物焊后变形与完整热结构仍待确认
  measurement_expanded_uncertainty_diameter_target_mm: 0.002
  bore_finish_strategy: 焊前孔40.010～40.018；焊后先验位置度，孔径合格不精整；仅在孔径低于40.020时定尺寸微珩，最终≤40.025
  finish_allowance_diameter_mm:
  - 0
  - 0
  post_weld_machining: 不预留固定余量；不得以机加工修正孔轴；微珩尺寸增量≤min(0.005,40.025−实测孔径)
  conformity_rule: 测得位置度直径＋同口径扩展不确定度≤0.05 mm
