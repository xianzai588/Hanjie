<text x="625" y="475" class="small">盖面枪74.0/118.0；丝72.7/116.7</text>
<text x="625" y="503" class="small">丝沿(-0.35,+0.93,+0.11225)延伸15后转竖直</text>
<text x="625" y="531" class="small">100 Hz；实测接触宽≥0.72，压痕深≤0.05</text>
<text x="625" y="559" class="small">扫尾≤18 mm/s、≤300 mm/s²，搭接≥75%</text>
<text x="625" y="587" class="small">表面400～500℃；测温/指令总延迟≤20 ms</text>
<text x="625" y="615" class="small">停弧0.20 s内枪丝升40，轻击轴继续扫尾</text>
<text x="625" y="643" class="small">气压0.2～0.4 MPa；驱动行程≤2，力另校准</text>
<text x="625" y="671" class="small">段两端各0.5及QT/焊趾/熔合线不施击</text>
<text x="625" y="699" class="small">坐标为热态R/z；枪/丝/锤各落点误差≤0.05</text>
