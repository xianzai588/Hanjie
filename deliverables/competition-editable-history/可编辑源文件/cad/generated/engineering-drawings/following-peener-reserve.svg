<text x="73" y="455" class="small">R45；z123～135</text>
<text x="75" y="495" class="small">Ø5 H13横臂，45±1 HRC</text>
<text x="290" y="605" class="small">根道接触R73.6/z116.4</text>
<text x="65" y="652" class="small">Ø6圆头；热态许用600 MPa，峰值≤200 N</text>
<text x="65" y="683" class="small">退位：先升枪丝120，再升轻击头，禁止交叉抬升</text>
