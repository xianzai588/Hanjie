<text x="1320" y="650" font-size="14" fill="#27384A" text-anchor="end">0.289</text>
<text x="925" y="678" font-size="14" fill="#27384A" text-anchor="start">接触坐实增量分配</text>
<text x="1320" y="678" font-size="14" fill="#27384A" text-anchor="end">0.250</text>
<text x="925" y="706" font-size="14" fill="#27384A" text-anchor="start">合计（径向分配6.5）</text>
<text x="1320" y="706" font-size="14" fill="#27384A" text-anchor="end">5.889</text>
<text x="925" y="734" font-size="14" fill="#27384A" text-anchor="start">机台摇摆剩余分配</text>
<text x="1320" y="734" font-size="14" fill="#27384A" text-anchor="end">0.611</text>
