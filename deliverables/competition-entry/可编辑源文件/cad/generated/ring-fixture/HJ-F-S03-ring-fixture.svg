<text x="535" y="217" font-size="16" fill="#27384A" text-anchor="start">产品上升140 + 上工具260</text>
<text x="70" y="251" font-size="15" fill="#27384A" text-anchor="start">RF20无孔盖：在z116.7从+y200横插至轴心，再上升0.8</text>
<text x="70" y="279" font-size="14" fill="#27384A" text-anchor="start">横插时锥顶净隙1.5、垫顶至托环0.8、盖至柱内缘15</text>
<line x1="405" y1="405" x2="470" y2="405" stroke="#315D83" stroke-width="2.5" marker-end="url(#arr)"/>
<text x="70" y="844" font-size="14" fill="#27384A" text-anchor="start">盘/铜/下反锥原位；产品从其外侧抬离，封底后沿+y横移</text>
<text x="925" y="170" font-size="20" fill="#27384A" text-anchor="start">退出操作与净隙</text>
<text x="925" y="211" font-size="14" fill="#27384A" text-anchor="start">1. 停弧≥120 s且最高温&lt;55℃</text>
<text x="925" y="234" font-size="14" fill="#27384A" text-anchor="start">2. 压环卸载；双止挡外退30</text>
<text x="925" y="257" font-size="14" fill="#27384A" text-anchor="start">3. 胀套主动上退1.5，确认收拢</text>
<text x="925" y="280" font-size="14" fill="#27384A" text-anchor="start">4. 铜瓣径退1.10；上工具升260</text>
<text x="925" y="303" font-size="14" fill="#27384A" text-anchor="start">5. A托环接管；壳体+托环升140</text>
<text x="925" y="326" font-size="14" fill="#27384A" text-anchor="start">6. 盖底z116.7，从+y200横插至轴心</text>
<text x="925" y="349" font-size="14" fill="#27384A" text-anchor="start">   盖+密封上升0.8，贴合锁定</text>
<text x="925" y="372" font-size="14" fill="#27384A" text-anchor="start">7. 封底反馈后，产品+y横移360</text>
<text x="925" y="395" font-size="14" fill="#27384A" text-anchor="start">壳上口z340 → 桥底z400: 60</text>
<text x="925" y="418" font-size="14" fill="#27384A" text-anchor="start">上胀套底z359.8 → 壳上口: 19.8</text>
<text x="925" y="441" font-size="14" fill="#27384A" text-anchor="start">托环底z120 → 反锥顶115.2: 4.8</text>
<text x="925" y="464" font-size="14" fill="#27384A" text-anchor="start">底盖下表面117.5 → 反锥顶: 2.3</text>
<line x1="925" y1="492" x2="1325" y2="492" stroke="#27384A" stroke-width="1.4"/>
<text x="925" y="527" font-size="20" fill="#27384A" text-anchor="start">冷态径向解析分配 / μm</text>
