<text x="925" y="809" font-size="13" fill="#27384A" text-anchor="start">标准件包络质量另列；采购件非实心质量</text>
<text x="925" y="837" font-size="14" fill="#27384A" text-anchor="start">热态、机台和坐实资格按工装卡执行</text>
