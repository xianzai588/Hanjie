<text x="1320" y="566" font-size="14" fill="#27384A" text-anchor="end">4.356</text>
<text x="925" y="594" font-size="14" fill="#27384A" text-anchor="start">基板与钢床座</text>
<text x="1320" y="594" font-size="14" fill="#27384A" text-anchor="end">0.162</text>
<text x="925" y="622" font-size="14" fill="#27384A" text-anchor="start">预紧螺栓弹性转角</text>
<text x="1320" y="622" font-size="14" fill="#27384A" text-anchor="end">0.833</text>
