monitoring_design:
  purpose: 当前圆环设计pWPS的数字监测窗口；电流和电压容差为监测设计值，设备接入后按评定与校准结果确认
  operation: final_GTAW
  current:
    supported_definitions:
    - instantaneous_pulsed_A
    - cycle_mean_A
    plateau_tolerance_A: 5.0
    cycle_mean_tolerance_A: 5.0
    minimum_samples_per_cycle: 20
    minimum_bad_cycles: 2
    phase_basis: 瞬时波形必须附脉冲相位起点、频率和占空比；按整周期评价峰值与基值，平均电流不得冒充瞬时波形
  voltage_window_V:
  - 11.0
  - 13.0
  travel_speed_relative_tolerance: 0.02
  temperature_definition: pre_arc_control_point_C
  temperature_gates: 首段起弧15～35℃；续焊起弧15～100℃；弧燃和冷却温度不按层间起弧温度误判
  bias_policy: 工艺窗口固定；有证书的离线传感器校准另行处理，不从本件焊接序列自动估计偏置或平移窗口
  minimum_event_duration_s: 0.05
  wire_feed_tolerance_mm_s: 0.05
  segment_energy_relative_tolerance: 0.02
  segment_path_relative_tolerance: 0.02
