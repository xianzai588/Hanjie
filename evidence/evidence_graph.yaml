taxonomy:
  sources:
    SRC-GB-T700:
      title: GB/T 700-2006 碳素结构钢
      type: national_standard
      relevance: Q235B 壳体化学成分与常温力学性能依据
      evidence_level: literature_supported
      status: unvalidated
      verification_status: citation_pending_verification
    SRC-GB-T1348:
      title: GB/T 1348-2019 球墨铸铁件
      type: national_standard
      relevance: QT450-10 主轴承座化学成分与抗拉强度依据
      evidence_level: literature_supported
      status: unvalidated
      verification_status: citation_pending_verification
    SRC-GB-T10044:
      title: GB/T 10044-2006 铸铁焊条及焊丝
      type: national_standard
      relevance: ERNiFe-CI 镍铁基焊丝选型依据
      evidence_level: literature_supported
      status: unvalidated
      verification_status: citation_pending_verification
    SRC-LIT-001:
      citation: Cárcel-Carrasco et al., Metals 2016, 6, 283
      relevance: 球铁异种连接 TIG 根部镍基填充与热管理规律
      evidence_level: literature_supported
      status: unvalidated
      verification_status: citation_pending_verification
    SRC-LIT-002:
      citation: El-Shennawy et al., Scientific Reports 2024, 14, 19827
      relevance: ENiFe-CI 熔合线微观组织与碳迁移抑制机制
      evidence_level: literature_supported
      status: unvalidated
      verification_status: citation_pending_verification
    SRC-LIT-003:
      citation: Martínez Alcón et al., Revista de Metalurgia 2021, 57(2)
      relevance: 低热输入 TIG 配合预热对球墨铸铁脆硬组织的改善效果
      evidence_level: literature_supported
      status: unvalidated
      verification_status: citation_pending_verification
  designs:
    DES-CAD-BASELINE:
      path: project/baseline.yaml
      parameters: Shell Ø160x5 mm, Wing R74.98 mm, H7/h6 fit, Taper 1/50 mandrel
      status: planned
      evidence_level: design_assumption
    DES-FIXTURE-TAPER:
      path: cad/fixture/
      parameters: Taper 1/50 mandrel (Ø39.90~40.10 mm), 500 N axial clamping
      status: planned
      evidence_level: design_assumption
  simulations:
    SIM-FE3D-BASE:
      path: studies/FE3D-BASE/results/convergence_summary.json
      scope: 经验代理原型；未运行 FE，Gate B.1 撤销
      status: unvalidated
      evidence_level: surrogate_result
    SIM-COMP-4-6-8:
      path: studies/STRUCTURE-4-6-8/results/structure_comparison_summary.json
      scope: 预设系数比较；尚未满足 FAIR-A/B
      status: unvalidated
      evidence_level: surrogate_result
    SIM-ROBUST-OPT:
      path: studies/ROBUST-OPT/results/robust_pareto_summary.json
      scope: 有限候选代理非支配筛选；无全局最优或疲劳证据
      status: unvalidated
      evidence_level: surrogate_result
  control_experiments:
    CTRL-ADAPT-SEQ:
      path: studies/ADAPTIVE-SEQUENCE/results/adaptive_sequence_study.json
      scope: 同一 plant、位置度预测器、评价函数和扰动下的焊序对照；含同序列回放公平性检查，未校准
      status: unvalidated
      evidence_level: surrogate_result
    CTRL-INV-PRECOMP:
      path: studies/PRECOMPENSATION/results/precompensation_summary.json
      scope: 合成模型下预偏置对照，未独立实测验证
      status: unvalidated
      evidence_level: synthetic_demo
  physical_experiments:
    EXP-TEMP-001:
      equipment: 待核实
      scope: 计划采集热电偶数据；设备与原始记录待确认
      status: planned
      evidence_level: design_assumption
      raw_data_path: null
    EXP-HARD-002:
      equipment: 待核实
      scope: 计划采集硬度曲线；设备与原始记录待确认
      status: planned
      evidence_level: design_assumption
      raw_data_path: null
    EXP-WELD-003-005:
      equipment: 待核实
      scope: 计划采集总成 CMM 数据；设备与原始记录待确认
      status: planned
      evidence_level: design_assumption
      raw_data_path: null
  measurements:
    MET-CMM-BENCH:
      instrument: 待核实；MPE 不能替代测量不确定度
      standard: ISO 1101 / GB/T 1958
      uncertainty: null
      evidence_level: design_assumption
      status: planned
    MET-VIS-GATE:
      path: automation/vision/results/difficult-summary.json
      instrument: 合成图像基准；实机型号待核实
      quality_gate: 径向 P95 <= 0.010 mm, 角度 P95 <= 0.0076 deg, 异常拒绝
      evidence_level: synthetic_demo
      status: planned
claims_graph:
  CLAIM-001:
    statement: 镍基填充 TIG 为候选工艺；本接头可靠性与白口抑制需小试验证
    confidence: unresolved
    supporting_evidence:
    - SRC-GB-T10044
    - SRC-LIT-001
    - SRC-LIT-002
    - SRC-LIT-003
    - EXP-HARD-002
    report_section: §2 材料与焊接性边界
    status: unresolved
  CLAIM-002:
    statement: FE3D 当前为经验代理，不能证明有限元收敛
    confidence: unresolved
    supporting_evidence:
    - SIM-FE3D-BASE
    - DES-CAD-BASELINE
    report_section: §4-§6 3D有限元网格收敛
    status: unresolved
  CLAIM-003:
    statement: 最终拓扑未定，六点最优主张撤回
    confidence: unresolved
    supporting_evidence:
    - SIM-COMP-4-6-8
    - SIM-ROBUST-OPT
    report_section: §4 结构选型与公平对比
    status: unresolved
  CLAIM-004:
    statement: Adaptive 使用统一代理评价；稳定优于 S3 与实物达标尚未验证
    confidence: unresolved
    supporting_evidence:
    - CTRL-ADAPT-SEQ
    - SIM-FE3D-BASE
    report_section: §7 自适应跳焊策略
    status: unresolved
  CLAIM-005:
    statement: 预偏置为受装配约束的候选控制方法；优于静态补偿尚未验证
    confidence: unresolved
    supporting_evidence:
    - CTRL-INV-PRECOMP
    - DES-CAD-BASELINE
    report_section: §8 逆向位姿补偿
    status: unresolved
  CLAIM-006:
    statement: 现有校准仅为合成演示；不支持物理后验或不确定度缩减结论
    confidence: unresolved
    supporting_evidence:
    - EXP-TEMP-001
    - EXP-HARD-002
    - EXP-WELD-003-005
    - MET-CMM-BENCH
    report_section: §9 合成校准演示边界
    status: unresolved
version: '4.2'
allowed_evidence_levels:
- official
- literature_supported
- design_assumption
- synthetic_demo
- surrogate_result
- solver_result_unvalidated
- solver_verified
- experiment_measured
- experiment_repeated
- calibrated
- rejected
