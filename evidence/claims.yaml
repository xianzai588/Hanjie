## 发布规则

**publication_status 定义**：
- `official`: 官方要求
- `verified`: 已验证，可直接作为结论（需本项目实测数据）
- `supported`: 有文献支持，可引用（文献证据）
- `literature_supported`: 文献支持的可行性（无本项目实测）
- `design_choice`: 设计选择，已明确标注
- `hypothesis`: 假设，需验证
- `proposed`: 提出的方法，尚未测试
- `screening_tool`: 筛选工具，不用于定量结论
- `preliminary_model`: 初步模型，有局限性
- `digital_prototype`: 数字样机，非实物
- `optimization_target`: 优化目标，尚未实现
- `experimental_validation_pending`: 等待实验验证

**撰写论文时规则**：
1. 所有 `hypothesis` / `proposed` 必须用"提出"、"设计"、"构建"等词
2. 所有 `unresolved` / `untested` 不能写"验证"、"证明"、"表明"
3. 所有 `digital_prototype` 必须注明"数字样本"
4. 所有 `preliminary_model` 必须注明局限性
5. 所有 `pending` 必须写"待验证"或完全不提

