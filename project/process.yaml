# 焊接工艺规范与窗口参数 - Hanjie Process Specification
# 当前参赛配置：COMPETITION-R1 / RC13
# 工艺路线：自动 TIG + NiFe 55 型实心TIG棒 + 四道沉积；本文件为当前工艺过程源

version: "COMPETITION-R1-PROCESS-1"
state: "current_design_source"
notes: "历史单段诊断不在本文件中承载；见 simulation/thermal-ref/results/competition-r2/r1-singlepass/assessment.json"
authority: "焊接工艺与填丝参数的唯一权威配置"

process:
  nominal:
    method: "automatic_TIG"
    current_a: 75.0
    voltage_v: 12.0
    travel_speed_mm_s: 1.5
    arc_efficiency: 0.55
    heat_input_j_per_mm: 330.0
    preheat_c: 150.0
    interpass_limit_c: 200.0
    filler_feed_rate_mm_s: 1.343967
    filler_diameter_mm: 1.6
    pass_count: 4
    sequence: [1, 4, 3, 6, 2, 5]
    shielding_gas: "99.999% Ar"
    gas_flow_rate_l_min: 10.0
    tungsten_electrode: "W-La20 (Ø2.0 mm)"
    nozzle_diameter_mm: 10.0
    standoff_distance_mm: 2.5

  joint_consistency:
    design_fillet_leg_mm: 3.5
    design_basis: "结构设计目标；承载、疲劳和宏观截面尚未验证"
    deposition_efficiency_nominal: 1.0
    deposition_efficiency_range: [0.85, 1.0]
    closure_status: "not_closed_pending_macrosection_and_load_basis"
    rule: "设计焊脚、实测成形截面、耗丝/增重和仿真沉积几何必须联合确认；禁止把母材熔化体积计作新增填丝"
    scenarios:
      historical_single_pass_diagnostic:
        evidence_file: "simulation/thermal-ref/results/competition-r2/r1-singlepass/assessment.json"
        disposition: "historical_only"
        current_process_authority: false
      current_4pass_design:
        pass_count: 4
        identity: "3.5 mm 理想三角截面的等面积四道当前设计候选"
        disposition: "design_candidate_pending_macrosection_load_basis_and_thermal_revalidation"
        feed_policy: "每道按相同目标沉积面积反算送丝；效率 0.85~1.0 作为边界，不取单一 WPS 值"
        thermal_policy: "四道总弧能与层间温度历史必须建立新输入版本重算，不继承单道收敛结论"

  acceptable_window:
    current_a:
      min: 65.0
      nominal: 75.0
      max: 85.0
    voltage_v:
      min: 11.0
      nominal: 12.0
      max: 13.5
    travel_speed_mm_s:
      min: 1.2
      nominal: 1.5
      max: 2.0
    heat_input_j_per_mm:
      min: 240.0
      max: 420.0
    preheat_c:
      min: 130.0
      nominal: 150.0
      max: 180.0
    interpass_limit_c:
      max: 200.0

  sequence_strategies:
    - name: "S1"
      type: "continuous_sequential"
      description: "顺次焊接，热累积极高，非对称变形大"
    - name: "S2"
      type: "fixed_diagonal"
      description: "固定对角跳焊，热对称性较好"
    - name: "S3"
      type: "fixed_intermittent"
      description: "固定六点跳焊序列 1->4->3->6->2->5"
    - name: "ADAPTIVE"
      type: "temperature_state_driven"
      description: "在线测温反馈 + 动态加权选段跳焊，受邻段道温门限与温差约束"
