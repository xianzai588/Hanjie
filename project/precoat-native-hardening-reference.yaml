date: '2026-10-07'
purpose: 单翼原生顺序制造需求参考；补足QT理想塑性输入中缺失的硬化，不赋予接头容量
model: 既有J2各向同性塑性，按应力—累计塑性应变表输入；不新增率相关或损伤模型
source:
  title: Determination of Johnson Cook Strength and Failure Parameters of EN-GJS-400 Spheroidal Graphite Cast Iron
  authors: Burak Özcan; Ulvi Şeker
  year: 2024
  url: https://dergipark.org.tr/tr/download/article-file/4098398
  locations: Table 1; Sections 2.2.1, 2.2.3, 3.1, 3.3; Graphs 1, 5, 6, 15; parameter table on p266
  material: EN-GJS-400，C4.23/Si2.68/Mn0.170%，非本批QT450-10
  tests_C: [27, 300, 500, 700]
  tensile_reference_rate_s_inverse: 0.011
  tensile_A_MPa: 310
  tensile_B_MPa: 728
  tensile_n: 0.5545
  measured_tensile_curve_plastic_strain_extent: 0.14
temperature_reference: project/precoat-mechanical-reference.yaml的QT屈服温度曲线保持不变
tabulation:
  equation: sigma(T,p)=Y_existing(T)*(1+(728/310)*p^0.5545)
  plastic_strain_points: [0, 0.00001, 0.00005, 0.0001, 0.00025, 0.0005, 0.001, 0.002, 0.005, 0.01, 0.02, 0.04, 0.06, 0.08, 0.10, 0.14]
  basis: 取公开准静态拉伸硬化形状，以原已冻结QT屈服温度曲线归一化；参数由文献确定，不按求解收敛选取
  high_temperature_scope: 700℃以上的归一化硬化形状为工程参考延拓；不是该论文实测，更不是QT450-10或重熔PMZ的已知曲线
  beyond_curve: 原生表尾不追加硬化；超过0.14的应变必须单独标识，不能作为已验证的材料响应
  rate_scope: 不引入论文的高速率乘子；焊接温度与应变率不由0.011每秒的来源试验自动取得资格
  metallurgical_scope: 原QT参考只用于制造需求；首次重熔组织与实际CI-A1/PMZ断裂容量仍单列
acceptance:
  solver_completion_alone_is_not_manufacturing_qualification: true
  retain_substrate_history: true
  require_cold_specific_volume_and_geometry_audit: true
  require_actual_retained_cut_and_reequilibrium: true
