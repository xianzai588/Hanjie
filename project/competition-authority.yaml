version: COMPETITION-R2-AUTHORITY
scope: 参赛说明书与答辩统一引用的保守设计口径
source_of_truth:
  design_config: project/competition-design.yaml
  process_config: project/process.yaml
  tolerance_config: project/tolerance.yaml
selected_candidate: 6P-FAIR_B/4pass
engineering_selection_status: pending_release_gates
digital_baseline: 6P-FAIR_B/4pass
low_heat_candidate: 6P-FAIR_B/4pass
higher_static_margin_candidate: 8P-FAIR_B/4pass
pareto_front:
  - Continuous/4pass
  - 8P-FAIR_B/4pass
  - 6P-FAIR_B/4pass
selection_method:
  hard_constraint: required_allowable_mpa <= 60.0 MPa in the stated reference screening scenario
  pareto_objectives:
    - minimize net_heat_input_kj
    - minimize weld_length_mm
    - minimize required_allowable_mpa
  decision_note: 三候选均处于当前Pareto前沿；6P为当前详细数字设计基线，不宣称唯一数学最优。8P为承载裕量切换候选，Continuous为高热输入/高焊缝长度参考。
assumptions:
  deposition_efficiency: 0.85
  load_scale: 1.0
  assumed_allowable_mpa: 60.0
  equivalent_leg_min_mm: 3.5
results:
  required_allowable_mpa: 52.1731967860798
  conditional_margin: 1.1500157877235626
  weld_length_mm: 108.0
  net_heat_input_kj: 142.56
  arc_on_time_s: 288.0
  fallback_candidate: 8P-FAIR_B/4pass
  fallback_required_allowable_mpa: 39.1298975895598
endpoints:
  current_efficiency_0_85_required_allowable_mpa: 52.1731967860798
  interpretation: 当前COMPETITION-R1四道比较按固定送丝与效率下界完成条件筛查；该值仅用于保守筛查。
decision_rule: 一级按统一60 MPa参考情景做硬约束，二级以净热输入、焊缝长度和所需许用应力构成Pareto前沿，三级保留6P为当前详细数字基线。真实载荷、焊后变形、裂纹、疲劳、洁净度和位置度放行门闭合后再决定最终工程方案，承载裕量不足时评定8P。
