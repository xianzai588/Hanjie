  water_bulkhead_design: 4个316L密封穿盘分配块，R55/45°起等分90°；12径向×16切向，z83.59～99.00；块体与盘板连续气密焊接，4微管口分配2供2回、下方独立水路。铜凸台不直接开M5，钎接OD1.80铜微管插入3
    mm，ID对应1.10/1.40；柔性PFA管SMC TLM0201或等效PFA，OD2/ID1，四瓣各4根合16根，上层水平Ω弯实装最小弯曲半径≥12（供方静态推荐10，往复首件确认）、额定≥0.3 MPa/60℃；布置内腔R43～69、z90.8～98.2，软管固定防擦并留1.15
    mm移动余量。首件按压力/运动/析出/洁净验收，不以铜接头直接弯折补行程。 各铜内凸台两级铜微管口在径向错开10 mm后转Ø2压紧接口，避免2 mm层间距直接布置大接头；两根每水路微管各≤100 mm，支路压差设计≥0.08 MPa；每路流量0.075～0.07875
    L/min；微管有效内径≥0.95，长度极限各105 mm。；定制316L M4×0.5压紧接头外包络≤Ø5×8，PFA插入≥4、低析出卡套；铜微管接5×5×5机加工L孔转向块，禁止往复弯折。局部端口坐标(58,±8,92)/(52,±8,94)，相邻孔中心距6.325，独立纵孔由盘下引入，端口不串通。；圆螺母Ø5双平面4.5、啮合≥2，含公差/温升/弯曲实装微管外径包络≤2.20。；转向块径向Ø1.80插管孔深1.50、内部水孔ID对应1.10/1.40交汇，切向整体M4螺纹凸嘴长3.50，PFA止口插入4；块与铜凸台同动，不设旋转接头。；固定块压紧帽端面齐平，独立下引孔(x52/58,y±3)，PFA插入4后至转向流道净隙≥0.5。
