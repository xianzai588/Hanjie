version: COMPETITION-R1
scope: 参赛设计方案；历史仿真输入保持原版本，本配置不追认旧结果
layout: 6P-FAIR_B
engineering_selection_status: pending_release_gates
digital_baseline_layout: 6P-FAIR_B
low_heat_candidate_layout: 6P-FAIR_B
higher_static_margin_candidate_layout: 8P-FAIR_B
selection_note: 当前6P为详细数字设计基线；8P仅为几何、热量和静力承载裕量切换候选，未冻结独立WPS与自动化段序
geometry_manifest: simulation/structural-v4/models/6p-fair-b/geometry-manifest.json
seat_brep: simulation/structural-v4/models/6p-fair-b/6P-FAIR_B.brep
shell_brep: simulation/structural-v4/common/shell.brep
process_source: project/process.yaml
assembly:
  seat_bottom_z_mm: 100.0
  bottom_open: true
  bottom_clearance_mm: 120.0
  datum_A: 壳体下端独立安装面
  datum_B: 壳体内壁两个轴向测量带拟合的轴线，按A法向约束定向
process:
  pass_count: 4
  sequence: [1, 4, 3, 6, 2, 5]
  wire_diameter_mm: 1.6
  deposition_efficiency_range: [0.85, 1.0]
  minimum_leg_mm: 3.5
  clearance_leg_mm: 3.8
  feed_policy: 按效率下界反算固定送丝；不得逐件假定已知沉积效率
  filler_candidate: NiFe 55 TIG实心棒材；供方页面标注EN ISO 1071 S C NiFe-2，AWS A5.15分类按批次证书核对
  filler_source: https://certilas.com/en/product/nife-55-tig
  wire_entry_offset_xyz_mm: [-1.0, -4.0, -0.5]
  hold_after_arc_s: 120.0
  release_below_c: 55.0
  measurement_temperature_c: 20.0
  measurement_temperature_band_c: 1.0
material_qualification_gate:
  status: blocked_pending_batch_evidence
  substrate_grade: QT450-10
  standard_grade_family: ferritic_to_pearlitic
  actual_batch_matrix_status: unverified
  required_evidence:
    - 批次质保书、炉批号、热处理状态和材料性能记录
    - 按GB/T 9441-2021形成的代表性金相，记录石墨形态、球化情况、铁素体/珠光体比例及碳化物
  blocks:
    - preheat_window_freeze
    - pwht_branch_selection
    - wps_pqr_release
  preheat_basis:
    current_candidate_c: 150
    current_candidate_status: not_released
    twi_process_scope: MMA/MIG类比，不是TIG认可窗口
    ferritic_nodular_mma_mig_c: [室温, 150]
    pearlitic_nodular_mma_mig_c: [200, 330]
    decision_rule: 未完成批次组织确认前不冻结TIG预热；明显珠光体强化或不符合原假设时重定TIG窗口并做代表性试件
  pwht_comparison_only: true
  qualification_scenarios:
    - id: I_no_pwht_nife
      filler: NiFe 55 TIG候选
      preheat_c: 150
      postheat: 覆盖缓冷，不做PWHT
      evidence: R007灰铸铁FC250在250℃预热但不做PWHT时，NiFe对应HAZ约442.5 HB；跨材料压力参照
      approved_for_production: false
    - id: II_nife_pwht
      filler: NiFe 55 TIG候选
      preheat_c: 250
      pwht_c: 650
      pwht_hold_min: 90
      evidence: R007灰铸铁FC250的HAZ约249.9 HB，焊缝约403.5 HB；PWHT后焊缝升硬
      approved_for_production: false
    - id: III_nici_pwht
      filler: Ni-CI
      preheat_c: 250
      pwht_c: 650
      pwht_hold_min: 90
      evidence: R007灰铸铁FC250的HAZ约223.8 HB、焊缝约195.9 HB；仅表示该研究的组织/硬度结果
      approved_for_production: false
  current_batch_release: blocked
fixture:
  type: 内置锥驱动开缝圆柱胀套＋独立端面压环＋底部承力柱
  bore_limits_mm: [40.0, 40.025]
  pre_weld_bore_diameter_mm: 39.60
  radial_machining_allowance_mm: 0.20
  collapsed_sleeve_diameter_mm: 39.54
  maximum_sleeve_diameter_mm: 39.64
  contact_bands_z_mm: [[101.0, 103.0], [109.0, 111.0]]
  contact_coverage_fraction: 0.9
  internal_cone_half_angle_deg: 10.0
  positive_return_stroke_mm: 1.0
  radial_force_limit_n: 100.0
  friction_scenarios: [0.0, 0.05, 0.1, 0.2]
  axial_clamp_force_n: 500.0
  upper_envelope_radius_mm: 30.0
  upper_envelope_top_z_mm: 220.0
  support_radius_mm: 30.0
  support_pad_radius_mm: 4.0
  support_count: 3
  support_top_z_mm: 100.0
  carrier_disk_radius_mm: 36.0
  carrier_disk_z_mm: [86.0, 90.0]
  carrier_post_radius_mm: 10.0
  carrier_post_bottom_z_mm: -20.0
shield:
  rigid_radius_mm: 74.0
  floor_z_mm: 90.0
  floor_thickness_mm: 1.0
  lip_z_mm: 94.0
  installed_lip_radius_mm: 75.0
  lip_thickness_mm: 0.15
  required_radial_compliance_mm: 0.35
  material_candidate: 连续金属薄裙＋刚性金属接料盘；薄裙材料与弹性结构待热接触验证
  joint_design: 薄裙内圈与盘体连续密封连接；穿盘支承与盘体连续密封连接
  withdrawal: 保持朝上、保持壁面接触，从开放底口竖直退出后封盖
precision:
  limit_diameter_mm: 0.05
  bore_length_mm: 12.0
  support_height_spread_limit_mm: 0.003
  allocation_source: project/tolerance.yaml
  status: 七项基准链算术闭合；焊接收缩、制造能力、测量不确定度和卸夹位移未闭合
  conformity_rule: 测得位置度直径＋同口径扩展不确定度≤0.05 mm
