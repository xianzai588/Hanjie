assembly:
  seat_bottom_z_mm: 100.0
  bottom_open: true
  bottom_clearance_mm: 220.0
  datum_A: 壳体下端独立安装面
  datum_B: 壳体内壁两个轴向测量带拟合的轴线，按A法向约束定向
  housing_lift_mm: 140.0
  upper_fixture_lift_mm: 260.0
