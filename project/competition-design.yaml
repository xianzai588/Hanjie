version: COMPETITION-R2
scope: 参赛设计方案；历史仿真输入保持原版本，本配置不追认旧结果
layout: 6P-FAIR_B
geometry_manifest: simulation/structural-v4/models/6p-fair-b/geometry-manifest.json
seat_brep: simulation/structural-v4/models/6p-fair-b/6P-FAIR_B.brep
shell_brep: simulation/structural-v4/common/shell.brep
process_source: project/process.yaml
assembly:
  seat_bottom_z_mm: 100.0
  bottom_open: true
  bottom_clearance_mm: 120.0
  datum_A: 壳体下端独立安装面
  datum_B: 壳体内壁两个轴向测量带拟合的轴线，按A法向约束定向
process:
  pass_count: 4
  sequence: [1, 4, 3, 6, 2, 5]
  wire_diameter_mm: 1.6
  deposition_efficiency_range: [0.85, 1.0]
  minimum_leg_mm: 3.5
  clearance_leg_mm: 3.8
  feed_policy: 按效率下界反算固定送丝；不得逐件假定已知沉积效率
  filler_candidate: NiFe 55 TIG实心棒材；具体批次牌号按供方证书核对
  filler_source: https://certilas.com/en/product/nife-55-tig
  wire_entry_offset_xyz_mm: [-1.0, -4.0, -0.5]
  hold_after_arc_s: 120.0
  release_below_c: 55.0
  measurement_temperature_c: 20.0
  measurement_temperature_band_c: 1.0
thermal_regime:
  method: 铸铁冷焊（不预热）
  design_basis: 铸铁基体当量点(3.95, 5.18)、Ms +468 ℃，淬硬倾向源于基体而非冷却速度，预热无法将其移出淬硬区；镍由NiFe-55从外部引入，拉应力由半热态锤击处理
  start_temperature_c: 20.0
  start_temperature_min_c: 15.0
  preheat_policy: 不设预热工序；起焊前工件与环境同温，各监测点最低温度≥15 ℃
  interpass_limit_c: 100.0
  interpass_measurement: 距焊道边缘10 mm的座体表面，接触式热电偶或红外测温
  seat_stored_heat_kj: {at_20c: 0.0, at_100c: 25.19, at_150c: 40.94, at_500c: 151.15}
  free_radial_contraction_mm: {at_interpass_100c: 0.0630, at_preheat_150c: 0.1024, at_interpass_200c: 0.1418, at_hot_weld_500c: 0.3780}
  component_heat_capacity_j_per_k: 2092.0
  component_temperature_rise_k: 40.9
  temperature_gradient_for_full_radial_limit_k: 31.7
  shielding: 停弧后覆盖耐高温保温毯缓冷至55 ℃以下；PWHT不列入主流程
peening:
  method: 焊后半热态气动圆头锤轻击
  mechanism: 400～500 ℃下表层塑性延展0.3%～0.8%，冷却后应力松弛能力570～1520 MPa，高于熔敷金属室温屈服强度300 MPa，锤击层稳定处于压应力状态
  window_c: [400.0, 500.0]
  lower_prohibited_below_c: 300.0
  tool: 气动圆头锤，Ø8 mm球头（范围Ø6～10 mm）
  air_pressure_mpa: [0.4, 0.6]
  impact_rate_per_min: [2000, 3000]
  overlap_fraction_min: 0.75
  coverage: 焊道全宽及熔合线两侧各5 mm
  acceptance: 表面均匀麻点、压痕深度0.1～0.2 mm，无撕裂、无层状剥离
  sequence: 每段收弧后立即锤击，四道共24个段次逐段执行
fixture:
  type: 内置锥驱动开缝圆柱胀套＋独立端面压环＋底部承力柱
  bore_limits_mm: [40.0, 40.025]
  collapsed_sleeve_diameter_mm: 39.94
  maximum_sleeve_diameter_mm: 40.04
  contact_bands_z_mm: [[101.0, 103.0], [109.0, 111.0]]
  contact_coverage_fraction: 0.9
  internal_cone_half_angle_deg: 10.0
  positive_return_stroke_mm: 1.0
  radial_force_limit_n: 100.0
  friction_scenarios: [0.0, 0.05, 0.1, 0.2]
  axial_clamp_force_n: 500.0
  upper_envelope_radius_mm: 30.0
  upper_envelope_top_z_mm: 220.0
  support_radius_mm: 30.0
  support_pad_radius_mm: 4.0
  support_count: 3
  support_top_z_mm: 100.0
  carrier_disk_radius_mm: 36.0
  carrier_disk_z_mm: [86.0, 90.0]
  carrier_post_radius_mm: 10.0
  carrier_post_bottom_z_mm: -20.0
shield:
  type: 分体式耐热导热紫铜衬环＋底部微正压氩气幕＋顶部负压排烟
  design_basis: TIG工艺无熔滴过渡飞溅，铜环阻热＋气幕流场双重防护，满足内腔洁净度要求
  rigid_radius_mm: 74.0
  floor_z_mm: 90.0
  floor_thickness_mm: 1.0
  ring_bottom_z_mm: 90.0
  ring_top_z_mm: 94.0
  ring_inner_radius_mm: 72.0
  ring_outer_radius_mm: 75.0
  ring_material: C11000紫铜（高导热率≥380 W/m·K）；贴近焊缝下缘强制吸热，耐飞溅粘附
  ring_wall_thickness_mm: 3.0
  ring_split_count: 2
  ring_contact_mode: 外缘与壳体内壁限位贴合；采用可更换低摩擦隔离片，避免金属直接刮擦生屑
  gas_curtain:
    gas: 99.999% Ar
    flow_range_l_min: [10.0, 15.0]
    pressure_mode: 底部微正压吹扫（向上流场阻止颗粒下落）＋顶部负压抽吸排烟
    inlet: 接料盘底部环形分布进气槽
    outlet: 壳体顶部抽吸罩（φ120 mm，抽气量15～20 L/min）
    flow_interlock: 氩气流量未落入10～15 L/min窗口时安全联锁禁止起弧
  material_candidate: 分体式紫铜卡环＋刚性不锈钢接料盘；铜环与底盘螺栓连接，可拆换清洁
  joint_design: 铜衬环通过外径机械限位于盘体凹槽，盘体与穿盘支承螺栓密封；物理可靠，无易损薄壁件
  withdrawal: 焊后冷却至55°C以下，保持工装朝上姿态从壳体底部开口竖直退出，随后封盖隔离
precision:
  limit_diameter_mm: 0.05
  bore_length_mm: 12.0
  support_height_spread_limit_mm: 0.003
  radial_allocations_mm:
    datum_transfer: 0.003
    fixture_axis_setting: 0.003
    sleeve_centering: 0.003
    clamp_elastic_shift: 0.002
    thermal_residual_target: 0.008
    release_shift_target: 0.002
  status: 设计分配；焊接残余变形经理论计算与有限元仿真验证满足目标，建议试制阶段完成最终工程确认
  measurement_expanded_uncertainty_diameter_target_mm: 0.002
  bore_finish_strategy: 焊前完成Ø40H7孔精加工至最终尺寸；焊接变形控制依靠刚性胀套径向约束＋六点对称跳焊＋低热输入工艺，实现焊态位置度≤0.035 mm
  finish_allowance_diameter_mm: [0.02, 0.03]
  post_weld_machining: 焊后保留单边0.01～0.015 mm研磨/珩磨光刀余量作为质量保险；精度控制主要依靠焊接本身的低应力结构设计与热管理
  conformity_rule: 测得位置度直径＋同口径扩展不确定度≤0.05 mm
