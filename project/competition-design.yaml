    mm后导管竖直到z220，枪/丝实际净隙2.169 mm
thermal_regime:
  method: 铸铁冷焊（不预热）
  design_basis: 室温短段为控形优先的GTAW设计热制度；Ni99首层限定铁素体主导来料，并独立检查PMZ/HAZ
  substrate_condition: QT450-10力学牌号合格；铁素体主导、珠光体面积分数≤20%、无原始白口/游离渗碳体网；20%为项目采购与方法资格窗口
  bore_fit_basis: QT原有Ø40主轴承孔，不增加轴套；20℃40.000～40.025为设计尺寸控制等级H7，非官方尺寸公差；ISO 286-2表格支持公差数值，不推导机型轴承配合或产品寿命
  candidate_manufacturing_bore_window_mm: [40.006, 40.008]
  manufacturing_bore_window_state: historical_window_pending_candidate_verification
  start_temperature_c: 20.0
  start_temperature_min_c: 15.0
  preheat_policy: 组焊不预热；Ni99预制堆焊是独立前工序，之后完成精加工及来料检验
  interpass_limit_c: 100.0
  interpass_measurement: 距焊道边缘10 mm的座体表面，接触式热电偶或红外测温
  seat_stored_heat_kj:
    at_20c: 0.0
    at_100c: 37.547
    at_150c: 61.913
    at_500c: 256.581
  free_radial_contraction_mm:
    at_interpass_100c: 0.063
    at_preheat_150c: 0.1024
    at_interpass_200c: 0.1418
    at_hot_weld_500c: 0.378
  component_heat_capacity_j_per_k: 2259.42
  shielding: 停弧后维持装夹与定流量水冷；温度门控卸夹并撤出铜环，再在20±1℃环境冷却测量，禁止强制骤冷
peening:
  method: 焊道凝固后随动热态轻击；停弧后加速覆盖段尾
  mechanism: 热态轻击使焊缝局部塑性延展，减轻收缩拉应力；强度与位置度计算不计锤击增益
  window_c:
  - 400.0
  - 500.0
  lower_prohibited_below_c: 400
  tool: Ø6圆头；Ø5 H13横臂；远置Ø10竖向气动活塞位于R45、z123～135
  air_pressure_mpa:
  - 0.2
  - 0.4
  impact_rate_per_min:
  - 6000
  - 6000
  overlap_fraction_min: 0.75
  coverage: 仅熔敷焊道中部；与QT母材、熔合线、焊趾各留≥0.5 mm，禁止直接敲击脆硬HAZ
  acceptance: 无撕裂、剥离；压痕深度≤0.05 mm；首件确定最低有效气压，不追求深麻点
  sequence: 两道×八段；实测400～500℃才轻击，超出窗口或缺温度信号则转工艺复核，不自动继续，不为锤击二次加热
  contact_force_peak_limit_N: 200
  maximum_tracking_speed_mm_s: 18
  maximum_tracking_acceleration_mm_s2: 300
  minimum_contact_width_mm: 0.72
  tool_operation: 100 Hz；实际压痕接触宽0.72～1.09 mm、深≤0.05，轨迹重叠≥75%；测温至指令总延迟≤20 ms；停弧后0.20 s内焊枪与送丝上提40 mm，轻击轴继续扫完段尾；轻击结束先升焊枪到120
    mm，再升轻击头；气动驱动行程≤2 mm并限冲击峰值200 N
  working_pose_error_per_tool_mm: 0.05
