version: THERMAL-0.5-XSEC
evidence_level: solver_result_unvalidated
baseline: project/thermal-mass-closed-v5.4r1.yaml
policy: 固定六条带焊道、沿焊道1.0mm、背景近区0.6mm/远区1.5mm、物理输入和dt=0.1s，仅细化焊材及两侧接口的n-z局部高梯度区
sources:
  surface45: {angle_deg: 45.0, penetration_fraction: 0.0}
source_basis: 与0.4R2-A相同的未校准surface45解析投影源；禁止按结果调整热效率、尺度或相变温度
observation_points:
  - {name: weld_center, material_id: 3, coordinate_s_n_z_mm: [0.0, -0.50, 0.50]}
  - {name: qt_near_interface, material_id: 2, coordinate_s_n_z_mm: [0.0, -0.20, -0.20]}
  - {name: qt_far, material_id: 2, coordinate_s_n_z_mm: [0.0, -1.00, -1.00]}
  - {name: q235_near_interface, material_id: 1, coordinate_s_n_z_mm: [0.0, 0.20, 0.00]}
  - {name: q235_far, material_id: 1, coordinate_s_n_z_mm: [0.0, 1.00, 0.00]}
frozen_mesh:
  arc_spacing_mm: 1.0
  near_spacing_mm: 0.6
  far_spacing_mm: 1.5
  bead_strips: 6
  bead_geometry_strips: 6
  radial_local_zone_mm: [-3.0, 1.5]
  axial_local_zone_mm: [-2.0, 2.0]
cases:
  - name: XSEC-M
    source: surface45
    properties: nominal
    mesh: controlled
    dt: 0.1
    mesh_overrides: {arc_spacing_mm: 1.0, near_spacing_mm: 0.6, far_spacing_mm: 1.5, bead_strips: 6, bead_geometry_strips: 6, cross_local_spacing_mm: 0.4, radial_local_zone_mm: [-3.0, 1.5], axial_local_zone_mm: [-2.0, 2.0]}
  - name: XSEC-F
    source: surface45
    properties: nominal
    mesh: controlled
    dt: 0.1
    mesh_overrides: {arc_spacing_mm: 1.0, near_spacing_mm: 0.6, far_spacing_mm: 1.5, bead_strips: 6, bead_geometry_strips: 6, cross_local_spacing_mm: 0.3, radial_local_zone_mm: [-3.0, 1.5], axial_local_zone_mm: [-2.0, 2.0]}
  - name: XSEC-VF
    source: surface45
    properties: nominal
    mesh: controlled
    dt: 0.1
    mesh_overrides: {arc_spacing_mm: 1.0, near_spacing_mm: 0.6, far_spacing_mm: 1.5, bead_strips: 6, bead_geometry_strips: 6, cross_local_spacing_mm: 0.2, radial_local_zone_mm: [-3.0, 1.5], axial_local_zone_mm: [-2.0, 2.0]}
acceptance:
  field_volume_weighted_mae_limit_c: 5.0
  field_volume_weighted_p95_limit_c: 10.0
  field_maximum_limit_c: 50.0
  fixed_point_rms_limit_c: 5.0
  fixed_point_peak_limit_c: 10.0
  threshold_flip_volume_limit_mm3: 1.0
  integral_relative_limit: 0.05
  exposure_geometry_limit_mm: 0.1
  asymptotic_reduction_ratio_max: 0.5
  rule: 门槛在运行前登记；只有F到VF相对M到F明显缩小且QT/NiFe阈值翻转同步稳定，才允许进入最终网格时间步复查
fallback: 若不单调、P95长期在十几度或翻转不稳定，则停止xfine并诊断热源投影、阶梯边界、材料界面通量和局部单元几何
