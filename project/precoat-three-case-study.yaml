claims_excluded:
- PMZ strength qualification
- full +/-15% robustness
- calibrated source dimensions
- actual transport dilution
- final 18mm coverage before endpoint analysis
case_C_scope: 'Combined adverse screening corner: net energy -15%, source radius +15%;
  not independent identification or a proven uncertainty envelope.'
source_depth_mm: 3.70251719953583
numerical_diagnosis: First surface runs found floating activation islands (17 of20
  initial Ni tetrahedra), followed by sharp leading-edge surface hot spots. Fix connected
  growth and use a distributed pool source; surface results retained as model diagnostics,
  not material rejection.
energy_contract: Reference q_net is applied net workpiece+deposit energy per path
  length. Electric U/I/efficiency must later be selected to supply it; no second geometric
  interception factor is applied to already-net energy.
central_overlap_each_half_mm: 1.6
track_design: Two radial strips, each two centre-out short tracks, with opposite first
  directions and 1.6mm overlap per half. This candidate overlap is geometric, not
  a claimed validated startup exclusion. No start at the thin physical wing edge.
