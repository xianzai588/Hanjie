# Hanjie 产品几何与夹具设计基线
# 版本: V4.3
# 工艺参数以 project/process.yaml 为准；产品、路径、测量三条公差链以
# project/tolerance.yaml 为准。本文件不再复制工艺和公差预算。

version: "V4.3"
last_updated: "2026-09-06"

# 1. 官方固定命题要求
official:
  shell_material: "Q235B"
  shell_outer_diameter_mm: 160.0
  shell_height_mm: 200.0
  shell_thickness_mm: 5.0
  bearing_bore_diameter_mm: 40.0
  seat_material: "QT450-10"
  position_tolerance_limit_mm: 0.05
  cleanliness_requirement: "内部不得出现可能落入压缩机内部的焊渣或飞溅物"

# 2. 正式设计几何基线
geometry:
  shell_outer_diameter_mm: 160.0
  shell_inner_diameter_mm: 150.0
  shell_thickness_mm: 5.0
  shell_height_mm: 200.0
  bearing_bore_diameter_mm: 40.0
  seat_core_outer_diameter_mm: 82.0
  seat_thickness_mm: 12.0
  wing_outer_radius_mm: 74.98
  wing_width_mm: 18.0
  slot_width_mm: 4.0
  weld_segment_length_mm: 18.0
  primary_layout_points: 6
  assembly_fit: "controlled_limit_clearance_fit"
  shell_inner_diameter_limits_mm: [150.00, 150.02]
  wing_outer_diameter_limits_mm: [149.94, 149.98]
  radial_clearance_min_mm: 0.01
  radial_clearance_max_mm: 0.04
  joint_type: "fillet_weld"
  fillet_leg_length_mm: 3.5

# 3. 夹具基线 (消除旧版 Ø39.96 销，采用 1/50 锥形心轴)
fixture:
  type: "tapered_mandrel"
  taper_ratio: 0.02  # 1/50
  taper_str: "1/50"
  small_diameter_mm: 39.90
  large_diameter_mm: 40.10
  effective_length_mm: 10.0
  axial_clamping_force_n: 500.0
  positioning_repeatability_mm: 0.008
  equivalent_stiffness_n_mm: 1200.0
  fixture_base_diameter_mm: 190.0
  release_temperature_c: 50.0
  release_temperature_band_c: 5.0
  release_condition_status: "design_assumption_pending_full_part_thermal_measurement"
