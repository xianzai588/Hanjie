version: TOLERANCE-2.0
authority: 当前参赛产品公差分项唯一来源；历史预算见 tolerance-legacy-route-b.yaml
target:
  tolerance_callout: Ø0.05 | A | B
  cylindrical_tolerance_zone_diameter_mm: 0.05
  radial_deviation_limit_mm: 0.025
quality_gates:
  vision:
    rejection_reasons:
    - extreme_illumination
    - excessive_blur
    - low_contrast
    - severe_distortion
    - heavy_occlusion
    action_on_failure: REFUSE_AND_ALARM
  temperature:
    max_peak_temperature_c: 1650.0
    interpass_gate_temperature_c: 200.0
    max_circumferential_delta_t_c: 40.0
  position_tolerance_cmm:
    acceptance_threshold_mm: 0.05
    guard_band_safety_margin_mm: 0.005
    guard_band_status: design_assumption_pending_uncertainty
evidence_level: design_assumption
budget_status: design_allocated_capability_unverified
legacy_v41_mixed_sum_mm: 0.028
legacy_v41_note: 旧表 0.028 而非 0.025 mm；混合路径/几何误差且含 P95，不能作为最坏情况上界
product_geometry_chain:
  unit: radial_mm
  interpretation: 终加工基准链的径向设计分配；含支点倾斜，焊接热残余由独立加工余量筛查管理。各项目标均未实测。
  contributions_mm:
    datum_transfer: 0.003
    fixture_axis_setting: 0.003
    sleeve_centering: 0.002
    initial_assembly_residual: 0.001
    clamp_elastic_shift: 0.002
    release_shift_target: 0.002
    support_tilt: 0.0008
  rss_mm: null
  p95_mm: null
  distribution_status: unknown
thermal_residual_management:
  position_budget_included: false
  method: 焊后收缩与角变形由径向加工余量筛查，并以焊后实测/终加工复核
  current_radial_machining_allowance_mm: 0.25
  selected_candidate: A2
  closure_status: pressure_screen_closed_joint_specific_measurement_pending
automation_path_chain:
  unit: mm
  evidence_level: design_assumption
  vision_radial_p95: 0.01
  camera_extrinsic: 0.004
  tcp_calibration: 0.003
  robot_repeatability: null
  product_sensitivities: null
  note: 机器人指标尚未核实；原 0.003 与设备表 0.03 不一致，待核实后经灵敏度映射，禁止直接相加
measurement_chain:
  expanded_uncertainty_mm: null
  coverage_factor: null
  components:
  - CMM
  - probe
  - datum_reconstruction
  - sampling
  - repeatability
  - environment
  note: MPE 不等于测量不确定度；未取得校准证书及重复测量数据
  design_expanded_uncertainty_diameter_target_mm: 0.002
